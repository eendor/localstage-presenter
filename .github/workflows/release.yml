name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: make test
      - name: package
        run: |
          mkdir -p dist/localstage
          cp localstage README.md dist/localstage/
          cp scripts/start.sh dist/localstage/start.sh
          chmod +x dist/localstage/start.sh dist/localstage/localstage
          tar -C dist -czf localstage-linux-x86_64.tar.gz localstage
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: localstage-linux-x86_64.tar.gz }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install poppler
      - run: make test
      - name: universal build
        run: |
          make clean
          make CFLAGS="-O2 -arch arm64 -arch x86_64"
          lipo -info localstage
      - name: package
        run: |
          mkdir -p dist/localstage
          cp localstage README.md dist/localstage/
          cp scripts/start.sh dist/localstage/start.command
          chmod +x dist/localstage/start.command dist/localstage/localstage
          cd dist && zip -qry ../localstage-macos-universal.zip localstage
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: localstage-macos-universal.zip }

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: make windows
      - name: package
        run: |
          mkdir -p dist/localstage
          cp localstage.exe scripts/run-localstage.bat README.md dist/localstage/
          cd dist && zip -qr ../localstage-windows.zip localstage
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: localstage-windows.zip }

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export KEYSTORE="$RUNNER_TEMP/release.jks"; fi
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          android/build.sh
          mv LocalStage.apk localstage-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: localstage-android.apk }

  publish:
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            localstage-linux-x86_64.tar.gz
            localstage-macos-universal.zip
            localstage-windows.zip
            localstage-android.apk
          body: |
            Download the file for your device and open it:
            - **Windows:** unzip, double-click `run-localstage.bat`
            - **macOS:** unzip, double-click `start.command` (Apple Silicon and Intel)
            - **Linux:** unzip, run `./start.sh`
            - **Android:** install `localstage-android.apk`, then share a PDF to LocalStage

            PDF slides work out of the box. PowerPoint files need LibreOffice; the launcher offers to install it.
